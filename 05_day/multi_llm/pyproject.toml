[project]
name = "multi_llm"
version = "0.1.0"
description = "multi_llm using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.102.0,<1.0.0",
]

[project.scripts]
kickoff = "multi_llm.main:kickoff"
plot = "multi_llm.main:plot"
nc = "multi_llm.main1:kickoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
