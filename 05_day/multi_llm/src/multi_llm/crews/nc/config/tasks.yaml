code_writing:
  description: >
    Write a python code that will generate a code about how to solve a problem
    that is given to you {problem}.
    Ensure the code is correct and easy to understand.
  expected_output: >
    A python code that will generate a code about how to solve a problem
    that is given to you {problem}.
  agent: code_writer

code_reviewing:
  description: >
    Review the python code and make sure it is correct and easy to understand.
  expected_output: >
    A review of the python code that  generated by code_writer (agent) will make sure it is correct and easy to understand.
  agent: code_reviewer